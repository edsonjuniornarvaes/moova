<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="mGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00BEDC"/>
      <stop offset="100%" stop-color="#4BD282"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.1
                0 0.7 0 0 0.3
                0 0 0.6 0 0.2
                0 0 0 0.5 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0D0D12"/>
    </radialGradient>
  </defs>

  <rect width="100" height="100" rx="18" fill="url(#bg)"/>

  <!-- Motion lines -->
  <g opacity="0.5">
    <line x1="18" y1="44" x2="28" y2="44" stroke="url(#mGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="15" y1="50" x2="28" y2="50" stroke="url(#mGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="17" y1="56" x2="28" y2="56" stroke="url(#mGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- M letter -->
  <g filter="url(#neonGlow)">
    <text x="58" y="64" font-family="Orbitron, sans-serif" font-weight="800" font-size="48"
      fill="url(#mGrad)" text-anchor="middle">M</text>
  </g>
</svg>
